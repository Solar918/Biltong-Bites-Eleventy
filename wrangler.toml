# Cloudflare D1 Database Binding
# Bind D1 database "biltong-bites-db" to the variable "DB" accessed in functions/
[[d1_databases]]
binding = "DB"
database_name = "biltong-bites-db"
database_id = "your-d1-database-id-here"

